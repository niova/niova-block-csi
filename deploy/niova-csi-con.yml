apiVersion: apps/v1
kind: Deployment
metadata:
  name: niova-csi
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: niova-csi-cont
  template:
    metadata:
      labels:
        app: niova-csi-cont
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: niova-csi-sa
      hostPID: true
      containers:
        - name: niova-csi
          image: paro1618/niova-csi:controller-v12
          securityContext:
            privileged: true
            capabilities:
              add:
                - CAP_SYS_ADMIN
                - CAP_SYS_RESOURCE
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - ulimit -l unlimited && exec /opt/niova/niova-block-csi-controller -driver-name=csi.niova.com -version=0.1.0 -node-id=$(NODE_ID) -endpoint=unix:///csi/custom2.sock -configpath=/etc/niova/gossipNodes -r ${NIOVA_GOSSIP_KEY} -Cplog=/niova-block/niova-csi.log
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NIOVA_BIN_PATH
              value: ""
            - name: NIOVA_GOSSIP_PATH
              value: "/etc/niova/gossipNodes"
            - name: NIOVA_GOSSIP_KEY
              value: "dummy"
            - name: NIOVA_BLOCK_CP_AUTH_USERNAME
              value: "admin"
            - name: NIOVA_BLOCK_CP_AUTH_SECRET
              value: "admin"
            - name: NIOVA_BLOCK_MDSVC_GET_CHUNKS_LIMIT
              value: "256"
            - name: NIOVA_TENANT_UUID
              value: ""
          terminationMessagePath: /tmp/termination-log
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
            - name: niova-var-dir
              mountPath: /var/niova
            - name: niova-block
              mountPath: /niova-block
              mountPropagation: Bidirectional
            - name: host-dev
              mountPath: /dev
              mountPropagation: HostToContainer
            - name: host-sys
              mountPath: /sys
            - name: host-mount
              mountPath: /run
            - name: kubelet-dir
              mountPath: /var/lib/kubelet/plugins
            - name: mountpoint-dir
              mountPath: /var/lib/kubelet/pods
            - name: mount-kb
              mountPath: /var/lib/kubelet
            - name: nisd-config
              mountPath: /var/lib/niova-csi
              mountPropagation: Bidirectional
            - name: gossip-config
              mountPath: /etc/niova/gossipNodes
              mountPropagation: Bidirectional

        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v3.5.0
          imagePullPolicy: Always
          args:
            - "--csi-address=/csi/custom2.sock"
            - "--extra-create-metadata"
            - "--v=5"
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.4.0
          imagePullPolicy: Always
          args:
            - "--csi-address=/csi/custom2.sock"
            - "--v=5"
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi 
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.niova.com
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: niova-var-dir
          hostPath:
            path: /var/niova
            type: DirectoryOrCreate
        - name: niova-block
          hostPath:
            path: /root/niova-block
            type: DirectoryOrCreate
        - name: host-dev
          hostPath:
            path: /dev
        - name: host-sys
          hostPath:
            path: /sys
        - name: host-mount
          hostPath:
            path: /run
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet/plugins
        - name: mountpoint-dir
          hostPath:
            path: /var/lib/kubelet/pods
        - name: mount-kb
          hostPath:
            path: /var/lib/kubelet
        - name: nisd-config
          hostPath: 
            path: /var/lib/niova-csi
        - name: gossip-config
          hostPath:
            path: /etc/niova/gossipNodes
            type: File
