apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: niova-csi-sc
provisioner: csi.niova.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  ublkrecovery: "true"
  csi.storage.k8s.io/fstype: "ext4"
  chunktype: "ecChunk" #rChunk/ecChunk
  datablkcnt: 3
  parityblkcnt: 2
  ecsize: 32  #32/64/128
